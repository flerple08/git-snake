name: git-profile-snake
description:
  Draw a GitHub account's snake from its public activity as a looping GIF, a still
  PNG, and a preview, for a profile README.
branding:
  icon: activity
  color: blue

inputs:
  login:
    description: Account whose snake to draw.
    default: ${{ github.repository_owner }}
  morph:
    description: Ball python morph, one of normal, pastel, banana, albino, axanthic, or cinnamon.
    default: normal
  output-dir:
    description:
      Folder, relative to the workspace, that receives snake.gif, snake.png, and
      preview.html.
    default: snake
  token:
    description:
      Token for reading the account's public data. Keep the built-in token,
      since the Action's process holds whatever token it is given and the
      built-in one reaches only this repository, for this job.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Download the git-snake release this Action belongs to
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        version=$(grep -m1 '^version' "$GITHUB_ACTION_PATH/Cargo.toml" | cut -d'"' -f2)
        repository=$(grep -m1 '^repository' "$GITHUB_ACTION_PATH/Cargo.toml" | cut -d'"' -f2)
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) target=x86_64-unknown-linux-musl ;;
          Linux-ARM64) target=aarch64-unknown-linux-musl ;;
          macOS-X64) target=x86_64-apple-darwin ;;
          macOS-ARM64) target=aarch64-apple-darwin ;;
          Windows-X64) target=x86_64-pc-windows-msvc ;;
          *)
            echo "git-snake has no build for $RUNNER_OS $RUNNER_ARCH; use ubuntu-latest" >&2
            exit 1
            ;;
        esac
        if [ "$RUNNER_OS" = Windows ]; then
          archive="git-snake-$version-$target.zip"
        else
          archive="git-snake-$version-$target.tar.gz"
        fi
        install_dir="$RUNNER_TEMP/git-snake"
        mkdir -p "$install_dir"
        if ! gh release download "v$version" --repo "$repository" --dir "$install_dir" \
            --pattern "$archive" --pattern "$archive.sha256"; then
          echo "release v$version has no asset $archive; reference the Action at a release tag" >&2
          exit 1
        fi
        cd "$install_dir"
        if command -v sha256sum > /dev/null; then
          sha256sum -c "$archive.sha256"
        else
          shasum -a 256 -c "$archive.sha256"
        fi
        case "$archive" in
          *.zip) unzip -q "$archive" ;;
          *) tar -xzf "$archive" ;;
        esac
        echo "$install_dir/git-snake-$version-$target" >> "$GITHUB_PATH"
    - name: Collect the account snapshot
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        SNAKE_LOGIN: ${{ inputs.login }}
      run:
        git-snake collect "$SNAKE_LOGIN" --output "$RUNNER_TEMP/snake-snapshot.json"
    - name: Render the snake
      shell: bash
      env:
        SNAKE_MORPH: ${{ inputs.morph }}
        SNAKE_OUTPUT_DIR: ${{ inputs.output-dir }}
      run:
        git-snake render "$RUNNER_TEMP/snake-snapshot.json" --output-dir
        "$SNAKE_OUTPUT_DIR" --morph "$SNAKE_MORPH"
