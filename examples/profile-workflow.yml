# Copy into your profile repository as .github/workflows/snake.yml, then embed
# <img src="snake/snake.gif" width="256" alt="My snake"> in its README.md.
name: Snake

on:
  schedule:
    # Just after midnight UTC, so the snake shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

concurrency: snake

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: flerple08/git-snake@v1
        with:
          morph: normal
          output-dir: snake
      - name: Commit the snake if it changed
        shell: bash
        run: |
          git add snake/snake.gif
          if git diff --cached --quiet; then
            echo "The snake is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "snake: draw the day's snake"
          git push --quiet
